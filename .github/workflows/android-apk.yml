name: Build Android APK

on:
  workflow_dispatch:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure debug keystore
        run: |
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /root/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # GitHub runs container steps with HOME=/github/home, but the godot-ci
      # image installs the export templates and the editor settings holding the
      # Android/Java SDK paths under /root. Copy them into the runtime HOME.
      - name: Stage Godot editor data into HOME
        run: |
          echo "HOME=$HOME"
          ls -la /root/.local/share/godot/export_templates || true
          ls -la /root/.config/godot || true
          grep -i -E "android_sdk_path|java_sdk_path" /root/.config/godot/editor_settings-4.tres || true
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config"
          cp -r /root/.local/share/godot/. "$HOME/.local/share/godot/"
          cp -r /root/.config/godot "$HOME/.config/"
          ls -la "$HOME/.local/share/godot/export_templates"

      - name: Import project
        run: godot --headless --import

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/marble-jumble.apk
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marble-jumble-apk
          path: build/android/marble-jumble.apk
